[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoupdate"
version = "0.24"
authors = [
    {name = "Christopher Toth", email = "q@q-continuum.net"},
]
description = "Autoupdate of end-user binaries on Windows, Linux and OSX"
requires-python = ">=3.8.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests",
    "platform_utils",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["autoupdate"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["autoupdate"]

[tool.pyright]
include = ["autoupdate"]
exclude = ["**/__pycache__"]
pythonVersion = "3.8"
typeCheckingMode = "basic"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportMissingImports = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=autoupdate",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "windows: tests specific to Windows platform",
    "darwin: tests specific to macOS platform",
    "linux: tests specific to Linux platform",
]
